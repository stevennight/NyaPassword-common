<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>结算 · 测试站点</title>
<style>body{font:15px system-ui;margin:0;background:#f4f6fa;display:flex;gap:24px;justify-content:center;padding:40px}form{background:#fff;padding:24px;border-radius:12px;width:320px;display:flex;flex-direction:column;gap:10px}input,select{padding:9px;border:1px solid #ccd;border-radius:8px}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}</style>
</head>
<body>
  <!-- A typical Chinese checkout page: shipping address (labels, a province
       select, no autocomplete) and a card form with month / year selects. -->
  <form id="addr" onsubmit="event.preventDefault()">
    <h3>收货地址</h3>
    <label>收货人 <input id="consignee" name="consignee"></label>
    <label>手机号码 <input id="mobile" name="mobile" type="tel"></label>
    <div class="row">
      <select id="province" name="province"><option value="">省份</option><option value="11">北京市</option><option value="31">上海市</option><option value="44">广东省</option></select>
      <input id="city" name="city" placeholder="城市">
      <input id="district" name="district" placeholder="区县">
    </div>
    <label>详细地址 <input id="detail" name="detail_address"></label>
    <label>邮编 <input id="zip" name="zip"></label>
  </form>
  <form id="pay" onsubmit="event.preventDefault()">
    <h3>银行卡支付</h3>
    <label>卡号 <input id="cardno" name="cardno" inputmode="numeric"></label>
    <label>持卡人 <input id="holder" name="holder"></label>
    <div class="row">
      <select id="mm" name="exp_month"><option value="">月</option><option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option><option>07</option><option>08</option><option>09</option><option>10</option><option>11</option><option>12</option></select>
      <select id="yy" name="exp_year"><option value="">年</option><option value="26">2026</option><option value="27">2027</option><option value="28">2028</option><option value="29">2029</option><option value="30">2030</option></select>
      <input id="cvv" name="cvv" maxlength="4" placeholder="CVV">
    </div>
    <button>支付</button>
  </form>
</body>
</html>
