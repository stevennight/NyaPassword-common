<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Passkey test RP</title></head>
<body>
  <!-- A minimal relying party: registers a passkey, then signs in with it and
       verifies the assertion signature itself with WebCrypto. -->
  <button id="create">create</button>
  <button id="get">get</button>
  <!-- like Google's sign-in challenge: WebAuthn called from a hidden about:blank frame -->
  <button id="get-blank">get from a hidden about:blank frame</button>
  <pre id="out"></pre>
  <script>
    const out = (s) => (document.getElementById('out').textContent = s);
    const rnd = (n) => crypto.getRandomValues(new Uint8Array(n));
    let saved = null;

    // DER ECDSA signature → raw r||s (WebCrypto wants raw)
    function derToRaw(der) {
      const b = new Uint8Array(der);
      let i = 2;
      const read = () => { i++; const len = b[i++]; let v = b.slice(i, i + len); i += len; while (v.length > 32 && v[0] === 0) v = v.slice(1); const r = new Uint8Array(32); r.set(v, 32 - v.length); return r; };
      const r = read(), s = read();
      const raw = new Uint8Array(64); raw.set(r); raw.set(s, 32); return raw;
    }

    document.getElementById('create').onclick = async () => {
      try {
        const c = await navigator.credentials.create({ publicKey: {
          rp: { name: 'Test RP', id: location.hostname },
          user: { id: rnd(16), name: 'alice@example.com', displayName: 'Alice' },
          challenge: rnd(32),
          pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
          authenticatorSelection: { residentKey: 'required', userVerification: 'required' },
        } });
        saved = { id: c.rawId, spki: c.response.getPublicKey() };
        out('created:' + c.id + ' alg:' + c.response.getPublicKeyAlgorithm());
      } catch (e) { out('error:' + e.name + ':' + e.message); }
    };

    document.getElementById('get-blank').onclick = async () => {
      const f = document.createElement('iframe');
      f.style.display = 'none';
      document.body.appendChild(f);
      window.__credentials = f.contentWindow.navigator.credentials;
      document.getElementById('get').click();
    };

    document.getElementById('get').onclick = async () => {
      try {
        const challenge = rnd(32);
        const a = await (window.__credentials ?? navigator.credentials).get({ publicKey: { challenge, rpId: location.hostname, userVerification: 'required' } });
        const cd = JSON.parse(new TextDecoder().decode(a.response.clientDataJSON));
        const key = await crypto.subtle.importKey('spki', saved.spki, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
        const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', a.response.clientDataJSON));
        const ad = new Uint8Array(a.response.authenticatorData);
        const signed = new Uint8Array(ad.length + 32); signed.set(ad); signed.set(hash, ad.length);
        const ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, derToRaw(a.response.signature), signed);
        const chal = btoa(String.fromCharCode(...challenge)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        out((ok && cd.type === 'webauthn.get' && cd.challenge === chal && cd.origin === location.origin ? 'VERIFIED' : 'BAD') + ' id:' + a.id);
      } catch (e) { out('error:' + e.name + ':' + e.message); }
    };
  </script>
</body>
</html>
