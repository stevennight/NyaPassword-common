[package]
name = "npw-wasm"
description = "NyaPassword core for the browser (web vault, extension) via wasm-bindgen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
npw-core.workspace = true
npw-model.workspace = true
npw-crypto.workspace = true
npw-otp.workspace = true
npw-match.workspace = true
npw-import.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
console_error_panic_hook = "0.1"
